<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Solid offset shadow -->
  <!-- Screen shadow -->
  <rect x="7" y="7" width="22" height="13" rx="1.5" fill="black" />
  <!-- Keyboard shadow -->
  <rect x="4" y="20" width="28" height="4" rx="1" fill="black" />
  
  <!-- Screen (Lid) -->
  <rect x="5" y="5" width="22" height="13" rx="1.5" fill="#E2E8F0" stroke="black" stroke-width="2" stroke-linejoin="round" />
  <!-- Screen display -->
  <rect x="8" y="7" width="16" height="9" fill="#0F172A" />
  <!-- Terminal Prompt -->
  <path d="M 10,10 L 12,11.5 L 10,13" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="14" y="12" width="3" height="1" fill="#38BDF8" />
  
  <!-- Keyboard Base -->
  <rect x="2" y="18" width="28" height="4" rx="1.5" fill="#CBD5E1" stroke="black" stroke-width="2" stroke-linejoin="round" />
  <!-- Trackpad -->
  <line x1="13" y1="20" x2="19" y2="20" stroke="black" stroke-width="1.5" stroke-linecap="round" />
</svg>

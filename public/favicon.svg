<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Solid offset shadow -->
  <rect x="6" y="6" width="22" height="8" rx="2" fill="black" />
  <rect x="9" y="14" width="16" height="14" fill="black" />
  
  <!-- Pipe Body -->
  <rect x="7" y="12" width="16" height="14" fill="#007200" stroke="black" stroke-width="2" />
  <!-- Highlight reflection on neck -->
  <rect x="10" y="12" width="3" height="14" fill="#38b000" opacity="0.5" />
  
  <!-- Pipe Flange (Top Lip) -->
  <rect x="4" y="4" width="22" height="8" rx="2" fill="#38b000" stroke="black" stroke-width="2" />
  <!-- Highlight reflection on lip -->
  <rect x="7" y="4" width="4" height="8" fill="#70e000" opacity="0.6" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Solid offset shadow -->
  <rect x="6" y="6" width="24" height="8" rx="2" fill="black" />
  <rect x="9" y="14" width="18" height="16" fill="black" />
  
  <!-- Pipe Body -->
  <rect x="7" y="12" width="18" height="16" fill="#007200" stroke="black" stroke-width="2" stroke-linejoin="round" />
  <!-- Highlights on body -->
  <rect x="9" y="13" width="3" height="14" fill="#38b000" />
  <rect x="10" y="13" width="1.5" height="14" fill="#70e000" />
  <!-- Shadow on body right side -->
  <rect x="21" y="13" width="3" height="14" fill="#004b00" />
  
  <!-- Pipe Flange (Top Lip) -->
  <rect x="4" y="4" width="24" height="8" rx="2" fill="#38b000" stroke="black" stroke-width="2" stroke-linejoin="round" />
  <!-- Highlights on flange -->
  <rect x="7" y="5" width="4" height="6" fill="#70e000" />
  <rect x="8" y="5" width="2" height="6" fill="#a7f3d0" />
  <!-- Shadow on flange right side -->
  <rect x="22" y="5" width="4" height="6" fill="#007200" />
</svg>